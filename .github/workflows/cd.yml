name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-mcp-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy mcp.json to .mcp.json
        run: cp mcp.json .mcp.json

      - name: Commit .mcp.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .mcp.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: sync .mcp.json from mcp.json [skip ci]"
          git push
