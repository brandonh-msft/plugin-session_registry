name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  publish-mcp-json:
    runs-on: ubuntu-latest
    env:
      SYNC_BRANCH: automation/sync-mcp-json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy mcp.json to .mcp.json
        run: cp mcp.json .mcp.json

      - name: Commit and push .mcp.json
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch --create "$SYNC_BRANCH"
          git add -f .mcp.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: sync .mcp.json from mcp.json"
          git push --force origin "HEAD:$SYNC_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create or update pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="$(gh pr list --base main --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number')"
          if [ -z "$pr_number" ]; then
            gh pr create \
              --base main \
              --head "$SYNC_BRANCH" \
              --title "chore: sync .mcp.json from mcp.json" \
              --body "Automated synchronization of \`.mcp.json\` from \`mcp.json\`."
          else
            echo "Pull request #$pr_number already exists"
          fi
